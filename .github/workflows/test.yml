name: Test

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  commands:
    name: scan and cp on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Scan the planted secret
        id: scan
        uses: ./
        continue-on-error: true
        with:
          command: scan
          path: test-fixtures/secrets

      - name: Check that the scan failed with findings and a SARIF report
        shell: bash
        env:
          OUTCOME: ${{ steps.scan.outcome }}
          EXIT_CODE: ${{ steps.scan.outputs.exit-code }}
          FINDINGS: ${{ steps.scan.outputs.findings }}
          SARIF_FILE: ${{ steps.scan.outputs.sarif-file }}
        run: |
          set -x
          test "$OUTCOME" = failure
          test "$EXIT_CODE" = 2
          test "$FINDINGS" = 2
          jq -e '[.runs[0].results[].ruleId] | sort == ["local-rules/aws-access-key", "local-rules/email"]' "$SARIF_FILE"
          jq -e 'all(.runs[0].results[].locations[0].physicalLocation.artifactLocation;
            .uri == "test-fixtures/secrets/deploy.env" and .uriBaseId == "%SRCROOT%")' "$SARIF_FILE"

      - name: Scan the planted secret without failing
        id: scan-never
        uses: ./
        with:
          command: scan
          path: test-fixtures/secrets
          categories: secrets, contact
          fail-on: never

      - name: Check that the scan passed with the same findings
        shell: bash
        env:
          EXIT_CODE: ${{ steps.scan-never.outputs.exit-code }}
          FINDINGS: ${{ steps.scan-never.outputs.findings }}
          CACHE_HIT: ${{ steps.scan-never.outputs.cache-hit }}
        run: |
          set -x
          test "$EXIT_CODE" = 0
          test "$FINDINGS" = 2
          test "$CACHE_HIT" = true

      - name: Redact the planted secret
        id: cp
        uses: ./
        with:
          command: cp
          path: test-fixtures/secrets
          destination: ${{ runner.temp }}/redacted/

      - name: Check that the copy has no planted value
        shell: bash
        env:
          EXIT_CODE: ${{ steps.cp.outputs.exit-code }}
          FINDINGS: ${{ steps.cp.outputs.findings }}
          SARIF_FILE: ${{ steps.cp.outputs.sarif-file }}
          REDACTED_FILE: ${{ runner.temp }}/redacted/deploy.env
        run: |
          set -x
          test "$EXIT_CODE" = 0
          test "$FINDINGS" = 2
          jq -e '.runs[0].results | length == 2' "$SARIF_FILE"
          grep -q '^AWS_ACCESS_KEY_ID=' "$REDACTED_FILE"
          if grep -e AKIAIOSFODNN7EXAMPLE -e jane.doe@example.com "$REDACTED_FILE"; then
            exit 1
          fi

  other-version:
    name: scan with a version that is not pinned
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Scan with redacter 0.22.0
        id: scan
        uses: ./
        with:
          command: scan
          path: test-fixtures/secrets
          fail-on: never
          version: 0.22.0
          addons: none

      - name: Check that the scan found the planted secret
        shell: bash
        env:
          EXIT_CODE: ${{ steps.scan.outputs.exit-code }}
          FINDINGS: ${{ steps.scan.outputs.findings }}
        run: |
          set -x
          test "$EXIT_CODE" = 0
          test "$FINDINGS" = 2

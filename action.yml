name: Redacter
description: Scan files for secrets and personal data (PII), or copy them redacted, and report the findings as SARIF for code scanning
author: Abdulla Abdurakhmanov
branding:
  icon: shield
  color: blue

inputs:
  command:
    description: The redacter command, `scan` to report the secrets and personal data it finds, or `cp` to copy files with them redacted.
    required: true
  path:
    description: File or directory to scan or copy, relative to the workspace.
    default: .
  destination:
    description: Where `cp` writes the redacted copy. End it with `/` to copy a directory. Only for `cp`.
  redacters:
    description: >-
      Redacters to run, separated by commas or new lines. The default runs on the runner only, so no data leaves it.
      `local-gliner` downloads a model of about 1.17 GB on the first run, and the next runs restore it from the cache.
    default: local-rules,local-credential-ml
  categories:
    description: Data categories to look for, comma separated, such as `secrets`, or only exclusions such as `!other`. Default is every category.
  fail-on:
    description: What makes `scan` fail, `findings`, `unconfirmed` or `never`. Default is `findings`. Only for `scan`.
  addons:
    description: Addons to install and cache, `auto` for OCR, PDF rendering and the models of the redacters, `none`, or a list such as `ocr,pdf`.
    default: auto
  version:
    description: The redacter release to install, 0.22.0 or later.
    default: 0.22.0
  args:
    description: Further redacter arguments, one per line, such as `--local-rules=secrets,url`.

outputs:
  sarif-file:
    description: Path of the SARIF report, for `github/codeql-action/upload-sarif`. Set when the step fails too.
    value: ${{ steps.run.outputs.sarif-file }}
  findings:
    description: Number of findings in the SARIF report, what `scan` found or what `cp` redacted.
    value: ${{ steps.run.outputs.findings }}
  exit-code:
    description: Exit code of redacter, 0, 2 when `scan` reported findings, or 1 on an error.
    value: ${{ steps.run.outputs.exit-code }}
  cache-hit:
    description: "`true` when the addons were restored from the cache."
    value: ${{ steps.restore-addons.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Not implemented
      shell: bash
      run: echo "redacter-action does not run redacter yet"
